<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>2048</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: "Clear Sans", "Segoe UI", Arial, sans-serif;
    background: #faf8ef;
    color: #776e65;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .app { width: 100%; max-width: 460px; }
  .screen { display: none; animation: fadeIn .25s ease; }
  .screen.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  h1.logo {
    font-size: 72px; font-weight: 800; color: #776e65;
    text-align: center; margin-bottom: 8px; letter-spacing: -2px;
  }
  .tagline { text-align: center; color: #a49a8d; margin-bottom: 32px; font-size: 15px; }

  .btn {
    display: block; width: 100%; padding: 16px;
    margin-bottom: 14px; border: none; border-radius: 8px;
    font-size: 20px; font-weight: 700; cursor: pointer;
    transition: transform .08s ease, filter .15s ease;
  }
  .btn:hover { filter: brightness(1.06); }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: #8f7a66; color: #f9f6f2; }
  .btn-accent { background: #edc22e; color: #6b5a2e; }
  .btn-ghost { background: transparent; color: #8f7a66; box-shadow: inset 0 0 0 2px #bbada0; font-size: 16px; padding: 12px; }

  .card {
    background: #fffdf8; border-radius: 10px; padding: 24px;
    box-shadow: 0 4px 24px rgba(119,110,101,.12);
  }
  .card h2 { font-size: 26px; margin-bottom: 18px; color: #776e65; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: #a49a8d; margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 12px 14px; font-size: 17px;
    border: 2px solid #d8cfc4; border-radius: 6px; background: #fff;
    color: #776e65; outline: none;
  }
  .field input:focus { border-color: #8f7a66; }
  .error { color: #e05b4b; font-size: 14px; min-height: 20px; margin: 4px 0 10px; font-weight: 600; }

  /* Leaderboard */
  .lb-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; border-radius: 8px; margin-bottom: 8px;
    background: #f3ecdf; font-size: 17px;
  }
  .lb-row.you { background: #edc22e; color: #6b5a2e; }
  .lb-rank { font-weight: 800; width: 34px; text-align: center; }
  .lb-name { flex: 1; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-score { font-weight: 800; }
  .lb-empty { text-align: center; color: #a49a8d; padding: 24px 0; }

  /* Game */
  .game-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .game-head h1 { font-size: 48px; font-weight: 800; }
  .scores { display: flex; gap: 8px; }
  .score-box {
    background: #bbada0; border-radius: 6px; padding: 6px 16px;
    text-align: center; color: #fff; min-width: 80px;
  }
  .score-box .label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #eee4da; }
  .score-box .value { font-size: 22px; font-weight: 800; }
  .game-sub { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .game-sub .who { font-size: 14px; color: #a49a8d; }
  .game-sub .who b { color: #776e65; }
  .small-btns { display: flex; gap: 8px; }
  .btn-sm {
    border: none; background: #8f7a66; color: #f9f6f2; border-radius: 6px;
    padding: 8px 14px; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .btn-sm:hover { filter: brightness(1.1); }

  .board-wrap { position: relative; }
  .board {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
    background: #bbada0; border-radius: 8px; padding: 10px;
    touch-action: none; user-select: none;
  }
  .cell {
    aspect-ratio: 1; background: #cdc1b4; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; transition: background .12s ease;
  }
  .cell.pop { animation: pop .18s ease; }
  @keyframes pop { 0% { transform: scale(.6); } 100% { transform: scale(1); } }

  .overlay {
    position: absolute; inset: 0; border-radius: 8px;
    background: rgba(250,248,239,.82);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; z-index: 5;
  }
  .overlay.show { display: flex; animation: fadeIn .35s ease; }
  .overlay h2 { font-size: 40px; color: #776e65; }
  .overlay p { color: #8f7a66; font-weight: 600; }
  .overlay .btn { width: auto; padding: 12px 28px; margin: 0; font-size: 16px; }

  .hint { text-align: center; font-size: 13px; color: #a49a8d; margin-top: 14px; }

  .v2  { background:#eee4da; color:#776e65; }
  .v4  { background:#ede0c8; color:#776e65; }
  .v8  { background:#f2b179; color:#f9f6f2; }
  .v16 { background:#f59563; color:#f9f6f2; }
  .v32 { background:#f67c5f; color:#f9f6f2; }
  .v64 { background:#f65e3b; color:#f9f6f2; }
  .v128{ background:#edcf72; color:#f9f6f2; }
  .v256{ background:#edcc61; color:#f9f6f2; }
  .v512{ background:#edc850; color:#f9f6f2; }
  .v1024{ background:#edc53f; color:#f9f6f2; }
  .v2048{ background:#edc22e; color:#f9f6f2; box-shadow: 0 0 18px rgba(237,194,46,.6); }
  .vbig{ background:#3c3a32; color:#f9f6f2; }

  @media (max-width: 420px) {
    h1.logo { font-size: 56px; }
    .game-head h1 { font-size: 40px; }
    .cell { font-size: 22px; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- MAIN SCREEN -->
  <div class="screen active" id="screen-main">
    <h1 class="logo">2048</h1>
    <p class="tagline">Join the numbers and get to the <b>2048</b> tile!</p>
    <button class="btn btn-primary" onclick="showScreen('screen-login')">Log in</button>
    <button class="btn btn-accent" onclick="showScreen('screen-signup')">Sign up</button>
  </div>

  <!-- LOGIN -->
  <div class="screen" id="screen-login">
    <div class="card">
      <h2>Log in</h2>
      <div class="field">
        <label for="login-name">Name</label>
        <input id="login-name" type="text" autocomplete="username" placeholder="Your name">
      </div>
      <div class="field">
        <label for="login-pass">Password</label>
        <input id="login-pass" type="password" autocomplete="current-password" placeholder="Your password">
      </div>
      <div class="error" id="login-error"></div>
      <button class="btn btn-primary" onclick="doLogin()">Log in</button>
      <button class="btn btn-ghost" onclick="showScreen('screen-main')">Back</button>
    </div>
  </div>

  <!-- SIGNUP -->
  <div class="screen" id="screen-signup">
    <div class="card">
      <h2>Sign up</h2>
      <div class="field">
        <label for="signup-name">Name</label>
        <input id="signup-name" type="text" autocomplete="username" placeholder="Pick a unique name">
      </div>
      <div class="field">
        <label for="signup-pass">Password</label>
        <input id="signup-pass" type="password" autocomplete="new-password" placeholder="At least 4 characters">
      </div>
      <div class="error" id="signup-error"></div>
      <button class="btn btn-accent" onclick="doSignup()">Create account</button>
      <button class="btn btn-ghost" onclick="showScreen('screen-main')">Back</button>
    </div>
  </div>

  <!-- MENU (after login) -->
  <div class="screen" id="screen-menu">
    <h1 class="logo">2048</h1>
    <p class="tagline">Welcome, <b id="menu-username"></b>!</p>
    <button class="btn btn-primary" onclick="startGame()">Play the Game</button>
    <button class="btn btn-accent" onclick="openLeaderboard()">Leaderboard</button>
    <button class="btn btn-ghost" onclick="doLogout()">Log out</button>
  </div>

  <!-- LEADERBOARD -->
  <div class="screen" id="screen-leaderboard">
    <div class="card">
      <h2>🏆 Leaderboard</h2>
      <div id="lb-list"></div>
      <button class="btn btn-ghost" onclick="showScreen('screen-menu')" style="margin-top:10px">Back</button>
    </div>
  </div>

  <!-- GAME -->
  <div class="screen" id="screen-game">
    <div class="game-head">
      <h1>2048</h1>
      <div class="scores">
        <div class="score-box"><div class="label">Score</div><div class="value" id="score">0</div></div>
        <div class="score-box"><div class="label">Best</div><div class="value" id="best">0</div></div>
      </div>
    </div>
    <div class="game-sub">
      <div class="who">Playing as <b id="game-username"></b></div>
      <div class="small-btns">
        <button class="btn-sm" onclick="newGame()">New Game</button>
        <button class="btn-sm" onclick="quitToMenu()">Menu</button>
      </div>
    </div>
    <div class="board-wrap">
      <div class="board" id="board"></div>
      <div class="overlay" id="overlay">
        <h2 id="overlay-title">Game over!</h2>
        <p id="overlay-sub"></p>
        <button class="btn btn-primary" onclick="newGame()">Try again</button>
      </div>
    </div>
    <p class="hint">Use arrow keys / WASD, or swipe on the board.</p>
  </div>

</div>

<script>
/* ================= Auth & storage ================= */
const USERS_KEY = "g2048_users";
const SESSION_KEY = "g2048_session";

function loadUsers() {
  try { return JSON.parse(localStorage.getItem(USERS_KEY)) || {}; }
  catch (e) { return {}; }
}
function saveUsers(u) { localStorage.setItem(USERS_KEY, JSON.stringify(u)); }

async function hash(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}

let currentUser = localStorage.getItem(SESSION_KEY) || null;

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  if (id === "screen-login") { document.getElementById("login-error").textContent = ""; }
  if (id === "screen-signup") { document.getElementById("signup-error").textContent = ""; }
}

async function doSignup() {
  const name = document.getElementById("signup-name").value.trim();
  const pass = document.getElementById("signup-pass").value;
  const err = document.getElementById("signup-error");
  if (!name) { err.textContent = "Please enter a name."; return; }
  if (name.length > 20) { err.textContent = "Name must be 20 characters or less."; return; }
  if (pass.length < 4) { err.textContent = "Password must be at least 4 characters."; return; }
  const users = loadUsers();
  const taken = Object.keys(users).some(n => n.toLowerCase() === name.toLowerCase());
  if (taken) { err.textContent = 'The name "' + name + '" is already taken. Please choose a different one.'; return; }
  users[name] = { pass: await hash(pass), best: 0 };
  saveUsers(users);
  currentUser = name;
  localStorage.setItem(SESSION_KEY, name);
  enterMenu();
}

async function doLogin() {
  const name = document.getElementById("login-name").value.trim();
  const pass = document.getElementById("login-pass").value;
  const err = document.getElementById("login-error");
  const users = loadUsers();
  const realName = Object.keys(users).find(n => n.toLowerCase() === name.toLowerCase());
  if (!realName) { err.textContent = "No account with that name. Please sign up first."; return; }
  if (users[realName].pass !== await hash(pass)) { err.textContent = "Wrong password."; return; }
  currentUser = realName;
  localStorage.setItem(SESSION_KEY, realName);
  enterMenu();
}

function doLogout() {
  currentUser = null;
  localStorage.removeItem(SESSION_KEY);
  showScreen("screen-main");
}

function enterMenu() {
  document.getElementById("menu-username").textContent = currentUser;
  showScreen("screen-menu");
}

/* ================= Leaderboard ================= */
function openLeaderboard() {
  const users = loadUsers();
  const rows = Object.entries(users).sort((a, b) => b[1].best - a[1].best);
  const list = document.getElementById("lb-list");
  if (!rows.length) {
    list.innerHTML = '<div class="lb-empty">No players yet. Be the first!</div>';
  } else {
    const medals = ["🥇", "🥈", "🥉"];
    list.innerHTML = rows.map(([name, u], i) =>
      '<div class="lb-row' + (name === currentUser ? " you" : "") + '">' +
        '<div class="lb-rank">' + (medals[i] || (i + 1)) + '</div>' +
        '<div class="lb-name">' + escapeHtml(name) + (name === currentUser ? " (you)" : "") + '</div>' +
        '<div class="lb-score">' + u.best + '</div>' +
      '</div>'
    ).join("");
  }
  showScreen("screen-leaderboard");
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* ================= 2048 game ================= */
let grid = [], score = 0, gameActive = false, won2048 = false, keepPlaying = false;

function startGame() {
  document.getElementById("game-username").textContent = currentUser;
  showScreen("screen-game");
  newGame();
}

function quitToMenu() { saveBest(); enterMenu(); }

function newGame() {
  grid = Array(16).fill(0);
  score = 0; gameActive = true; won2048 = false; keepPlaying = false;
  document.getElementById("overlay").classList.remove("show");
  const kp = document.getElementById("keep-playing-btn");
  if (kp) kp.remove();
  addRandomTile(); addRandomTile();
  render(true);
}

function addRandomTile() {
  const empty = grid.map((v, i) => v === 0 ? i : -1).filter(i => i >= 0);
  if (!empty.length) return;
  grid[empty[Math.floor(Math.random() * empty.length)]] = Math.random() < 0.9 ? 2 : 4;
}

function slideLine(line) {
  const arr = line.filter(v => v !== 0);
  const mergedIdx = [];
  for (let i = 0; i < arr.length; i++) {
    if (i < arr.length - 1 && arr[i] === arr[i + 1]) {
      arr[i] *= 2; score += arr[i]; mergedIdx.push(i);
      if (arr[i] === 2048 && !won2048 && !keepPlaying) { won2048 = true; }
      arr.splice(i + 1, 1);
    }
  }
  while (arr.length < 4) arr.push(0);
  return { arr, mergedIdx };
}

let lastMerged = [];

function move(dir) { // 0=left 1=up 2=right 3=down
  if (!gameActive) return;
  const before = grid.join(",");
  lastMerged = [];
  for (let line = 0; line < 4; line++) {
    const idx = [];
    for (let k = 0; k < 4; k++) {
      if (dir === 0) idx.push(line * 4 + k);
      else if (dir === 2) idx.push(line * 4 + (3 - k));
      else if (dir === 1) idx.push(k * 4 + line);
      else idx.push((3 - k) * 4 + line);
    }
    const res = slideLine(idx.map(i => grid[i]));
    res.arr.forEach((v, k) => grid[idx[k]] = v);
    res.mergedIdx.forEach(k => lastMerged.push(idx[k]));
  }
  if (grid.join(",") === before) return;
  addRandomTile();
  render();
  saveBest();
  if (won2048 && !keepPlaying) {
    gameActive = false;
    showOverlay("You win! 🎉", "You reached 2048! Score: " + score, true);
    return;
  }
  if (!movesAvailable()) {
    gameActive = false;
    showOverlay("Game over!", "Final score: " + score, false);
  }
}

function movesAvailable() {
  if (grid.includes(0)) return true;
  for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
    const v = grid[r * 4 + c];
    if (c < 3 && grid[r * 4 + c + 1] === v) return true;
    if (r < 3 && grid[(r + 1) * 4 + c] === v) return true;
  }
  return false;
}

function showOverlay(title, sub, isWin) {
  document.getElementById("overlay-title").textContent = title;
  document.getElementById("overlay-sub").textContent = sub;
  const ov = document.getElementById("overlay");
  ov.classList.add("show");
  if (isWin) {
    const btn = document.createElement("button");
    btn.className = "btn btn-accent";
    btn.textContent = "Keep playing";
    btn.style.width = "auto"; btn.style.padding = "12px 28px"; btn.style.margin = "0"; btn.style.fontSize = "16px";
    btn.id = "keep-playing-btn";
    btn.onclick = () => { keepPlaying = true; gameActive = true; ov.classList.remove("show"); btn.remove(); };
    ov.appendChild(btn);
  }
}

function saveBest() {
  if (!currentUser) return;
  const users = loadUsers();
  if (users[currentUser] && score > users[currentUser].best) {
    users[currentUser].best = score;
    saveUsers(users);
  }
}

function tileClass(v) {
  if (v === 0) return "";
  if (v <= 2048) return "v" + v;
  return "vbig";
}

function render(isNew) {
  const board = document.getElementById("board");
  board.innerHTML = "";
  for (let i = 0; i < 16; i++) {
    const v = grid[i];
    const d = document.createElement("div");
    d.className = "cell " + tileClass(v);
    d.textContent = v === 0 ? "" : v;
    if (v >= 128) d.style.fontSize = "26px";
    if (v >= 1024) d.style.fontSize = "21px";
    if (v > 0 && (isNew || lastMerged.includes(i))) d.classList.add("pop");
    board.appendChild(d);
  }
  document.getElementById("score").textContent = score;
  const users = loadUsers();
  const best = currentUser && users[currentUser] ? users[currentUser].best : 0;
  document.getElementById("best").textContent = Math.max(best, score);
}

/* keyboard */
document.addEventListener("keydown", e => {
  if (!document.getElementById("screen-game").classList.contains("active")) {
    if (e.key === "Enter") {
      if (document.getElementById("screen-login").classList.contains("active")) doLogin();
      else if (document.getElementById("screen-signup").classList.contains("active")) doSignup();
    }
    return;
  }
  const map = {
    ArrowLeft: 0, a: 0, A: 0,
    ArrowUp: 1, w: 1, W: 1,
    ArrowRight: 2, d: 2, D: 2,
    ArrowDown: 3, s: 3, S: 3
  };
  if (e.key in map) { e.preventDefault(); move(map[e.key]); }
});

/* touch swipe */
(function () {
  let sx = 0, sy = 0, tracking = false;
  const board = document.getElementById("board");
  board.addEventListener("touchstart", e => {
    const t = e.touches[0]; sx = t.clientX; sy = t.clientY; tracking = true;
  }, { passive: true });
  board.addEventListener("touchmove", e => e.preventDefault(), { passive: false });
  board.addEventListener("touchend", e => {
    if (!tracking) return; tracking = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 2 : 0);
    else move(dy > 0 ? 3 : 1);
  });
})();

/* restore session */
if (currentUser && loadUsers()[currentUser]) enterMenu();
</script>
</body>
</html>
